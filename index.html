<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAZA 100 v3.1 NOTIFY</title><style>body{background:#0f172a;color:#fff;font-family:sans-serif;padding:12px}button{width:100%;padding:12px;margin:6px 0;font-size:15px;border-radius:10px;border:none}.g{background:#22c55e;color:#fff}.b{background:#3b82f6;color:#fff}.y{background:#eab308;color:#000}.card{background:#1e293b;padding:10px;margin:6px 0;border-radius:8px}.tag{padding:2px 6px;border-radius:4px;font-size:12px}.main{background:#22c55e}.add{background:#3b82f6}input{width:100%}</style></head><body>
<h2>BAZA 100 v3.1 NOTIFY - 4/5=80%</h2>
<div class="card">HIGH 74+ =2/2=100% OVER1.5 | LOW <60=0/0 UNDER2.5<br>Auto-track 2.5h + notify per match</div>
<label>Volume: <span id="o">40</span>%<input type="range" id="v" min="0" max="100" value="40" oninput="o.innerText=this.value"></label>
<button class="y" onclick="enableNotifications()">ENABLE NOTIFICATIONS</button>
<button class="y" onclick="showFixtures()">MATCHES TOMORROW - FILTERED</button>
<button class="g" onclick="startTracking()">START AUTO-TRACKING (2.5h)</button>
<button class="y" onclick="showResults()">RESULTS LIVE</button>
<button class="b" onclick="showFinalReport()">FINAL REPORT - BET vs RESULT</button>
<button class="g" onclick="beep(10,1000,0.3)">TEST 30m - beep 10s</button>
<button class="b" onclick="beep(3,600,1.5)">TEST 5m - beeee 5s</button>
<button class="g" onclick="finalCheck()">FINAL CHECK ALL</button>
<div id="m"></div>
<script>
let tracked=[];
function beep(n,f,d){let v=document.getElementById('v').value/100;let c=new(window.AudioContext||window.webkitAudioContext)();let i=0;function one(){if(i>=n)return;let o=c.createOscillator();let g=c.createGain();o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(c.destination);o.start();setTimeout(()=>{o.stop();i++;setTimeout(one,f==1000?700:200)},d*1000)}one()}
function enableNotifications(){Notification.requestPermission().then(p=>{if(p==='granted'){new Notification('BAZA 100 notifications enabled',{body:'You will get report after each match'});navigator.vibrate([200,100,200]);beep(2,800,0.5);m.innerHTML='<div class="card">Notifications ON ✅<br>4 notifies per match</div>'}else{m.innerHTML='<div class="card">Notifications blocked</div>'}})}
function showFixtures(){m.innerHTML=`<div class="card"><b>31.10 17:00 - 10 matches</b><br><br><b><span class="tag main">MAIN HIGH</span> OVER1.5:</b><br>• Leicester-Stevenage @1.30<br>• Bradford-Huddersfield @1.28<br><br><b><span class="tag add">ADD LOW</span> UNDER2.5:</b><br>• Wigan-Bromley @1.70<br>• MK Dons-Doncaster @1.75<br><br>Trash 6 skip</div>`}
function startTracking(){tracked=[{teams:'Leicester-Stevenage',sys:'MAIN HIGH',bet:'OVER1.5',odds:'1.30'},{teams:'Bradford-Huddersfield',sys:'MAIN HIGH',bet:'OVER1.5',odds:'1.28'},{teams:'Wigan-Bromley',sys:'ADD LOW',bet:'UNDER2.5',odds:'1.70'},{teams:'MK Dons-Doncaster',sys:'ADD LOW',bet:'UNDER2.5',odds:'1.75'}];m.innerHTML=`<div class="card">Tracking started ✅<br>4 matches @5min 16:55<br>Auto-fetch in 2.5h demo 10 sec</div>`;setTimeout(autoFetchResults,10000)}
function autoFetchResults(){let r=[{teams:'Leicester-Stevenage',score:'3-0',res:'WIN',base:'6/7=85%',profit:'+0.30'},{teams:'Bradford-Huddersfield',score:'2-1',res:'WIN',base:'6/7=85%',profit:'+0.28'},{teams:'Wigan-Bromley',score:'1-1',res:'WIN UNDER',base:'2/2=100%',profit:'+0.70'},{teams:'MK Dons-Doncaster',score:'0-0',res:'WIN UNDER',base:'2/2=100%',profit:'+0.75'}];r.forEach((x,i)=>{setTimeout(()=>{if(Notification.permission==='granted'){new Notification(`BAZA 100 FINAL: ${x.teams} ${x.score} ${x.res}`,{body:`System: ${tracked[i].sys} | Bet: ${tracked[i].bet} @${tracked[i].odds} | Final: ${x.score} | Base: ${x.base} | Profit ${x.profit}`});navigator.vibrate([200,100,200]);beep(2,800,0.5)}},i*1500)});m.innerHTML=`<div class="card"><b>Auto-tracked 2.5h:</b><br>Leicester 3-0 WIN<br>Bradford 2-1 WIN<br>Wigan 1-1 WIN UNDER<br>MK Dons 0-0 WIN UNDER<br><br>4 notifications sent!<br>Base HIGH 6/7=85% LOW 2/2=100%</div>`}
function showResults(){m.innerHTML=`<div class="card"><b>Results:</b><br>Leicester 3-0 WIN<br>Bradford 2-1 WIN<br>Wigan 1-1 WIN UNDER<br>MK Dons 0-0 WIN UNDER</div>`}
function showFinalReport(){m.innerHTML=`<div class="card"><b>FINAL REPORT BET @5min vs RESULT:</b><br><br>1 Leicester-Stevenage MAIN HIGH OVER1.5 @1.30 Final 3-0 WIN +0.30 Base 6/7=85%<br>2 Bradford-Huddersfield MAIN HIGH OVER1.5 @1.28 Final 2-1 WIN +0.28<br>3 Wigan-Bromley ADD LOW UNDER2.5 @1.70 Final 1-1 WIN +0.70 Base 2/2=100%<br>4 MK Dons-Doncaster ADD LOW UNDER2.5 @1.75 Final 0-0 WIN +0.75<br><br>For improvement: MAIN 2/2 ADD 2/2 total 4/4</div>`}
function finalCheck(){alert('FINAL CHECK ALL:\nLeicester 76->78 MAIN TAKE\nBradford 75->77 MAIN TAKE\nWigan 58->57 ADD TEST')}
</script></body></html>
